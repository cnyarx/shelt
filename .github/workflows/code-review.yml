name: Code Review

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: x86_64-unknown-linux-musl

      - name: Install Linux musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools binutils

      - name: Install dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: Build web client
        run: bun run build

      - name: Run TypeScript tests
        run: bun test

      - name: Type-check TypeScript
        run: bun run typecheck

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --all-targets --all-features

      - name: Build standalone executable
        run: bun run compile

      - name: Verify static Linux musl ABI
        run: |
          scripts/check-linux-musl.sh release/shelt-linux-x86_64-musl
          cd release
          sha256sum --check shelt-linux-x86_64-musl.sha256

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: shelt-linux-x86_64-musl
          path: |
            release/shelt-linux-x86_64-musl
            release/shelt-linux-x86_64-musl.sha256
          if-no-files-found: error

  validate-macos-aarch64:
    name: Build macOS Apple Silicon
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: Build web client
        run: bun run build

      - name: Build standalone executable
        run: bun run src/compile.ts --target aarch64-apple-darwin

      - name: Verify macOS Apple Silicon executable
        run: |
          file release/shelt-macos-aarch64 | grep -q 'Mach-O 64-bit executable arm64'
          cd release
          shasum -a 256 --check shelt-macos-aarch64.sha256
          ./shelt-macos-aarch64 url

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: shelt-macos-aarch64
          path: |
            release/shelt-macos-aarch64
            release/shelt-macos-aarch64.sha256
          if-no-files-found: error
