name: Release

on:
  workflow_run:
    workflows:
      - Code Review
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Publish next patch release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: Build standalone executable
        run: bun run compile

      - name: Determine next version
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          existing=$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" --list 'v0.0.*' | head -n 1)
          if [[ -n "$existing" ]]; then
            echo "Commit already released as $existing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list 'v0.0.*' --sort=-version:refname | head -n 1)
          if [[ -z "$latest" ]]; then
            next="v0.0.1"
          elif [[ "$latest" =~ ^v0\.0\.([0-9]+)$ ]]; then
            next="v0.0.$((BASH_REMATCH[1] + 1))"
          else
            echo "Unsupported latest release tag: $latest" >&2
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Package executable
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          install -m 755 release/shelt shelt-linux-x86_64
          sha256sum shelt-linux-x86_64 > shelt-linux-x86_64.sha256

      - name: Publish GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            shelt-linux-x86_64 \
            shelt-linux-x86_64.sha256 \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
