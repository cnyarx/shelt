name: Release

on:
  workflow_run:
    workflows:
      - Code Review
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build Linux x86_64 musl
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Linux musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools binutils

      - name: Install dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: Build standalone executable
        run: bun run compile

      - name: Verify static Linux musl ABI
        run: |
          scripts/check-linux-musl.sh release/shelt-linux-x86_64-musl
          cd release
          sha256sum --check shelt-linux-x86_64-musl.sha256

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: shelt-linux-x86_64-musl
          path: |
            release/shelt-linux-x86_64-musl
            release/shelt-linux-x86_64-musl.sha256
          if-no-files-found: error

  build-macos-aarch64:
    name: Build macOS Apple Silicon
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: Build standalone executable
        run: bun run build && bun run src/compile.ts --target aarch64-apple-darwin

      - name: Verify macOS Apple Silicon executable
        run: |
          file release/shelt-macos-aarch64 | grep -q 'Mach-O 64-bit executable arm64'
          cd release
          shasum -a 256 --check shelt-macos-aarch64.sha256
          ./shelt-macos-aarch64 url

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: shelt-macos-aarch64
          path: |
            release/shelt-macos-aarch64
            release/shelt-macos-aarch64.sha256
          if-no-files-found: error

  publish:
    name: Publish next patch release
    needs:
      - build-linux
      - build-macos-aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download release executables
        uses: actions/download-artifact@v5
        with:
          pattern: shelt-*
          path: release
          merge-multiple: true

      - name: Determine next version
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          existing=$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" --list 'v0.0.*' | head -n 1)
          if [[ -n "$existing" ]]; then
            echo "Commit already released as $existing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list 'v0.0.*' --sort=-version:refname | head -n 1)
          if [[ -z "$latest" ]]; then
            next="v0.0.1"
          elif [[ "$latest" =~ ^v0\.0\.([0-9]+)$ ]]; then
            next="v0.0.$((BASH_REMATCH[1] + 1))"
          else
            echo "Unsupported latest release tag: $latest" >&2
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/shelt-linux-x86_64-musl \
            release/shelt-linux-x86_64-musl.sha256 \
            release/shelt-macos-aarch64 \
            release/shelt-macos-aarch64.sha256 \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
