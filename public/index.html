<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <title>Shelt</title>
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="stylesheet" href="/client.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main id="auth" aria-labelledby="auth-title">
      <form id="auth-form" autocomplete="on">
        <img src="/favicon.svg" alt="" width="112" height="112" />
        <h1 id="auth-title">Unlock Shelt</h1>
        <p id="auth-description">Enter your password to open the terminal.</p>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="256" />
        <label id="confirm-row" for="confirm-password" hidden>Confirm password</label>
        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="256" hidden />
        <label class="remember"><input id="remember" type="checkbox" /> Remember this browser</label>
        <p id="auth-error" role="alert" aria-live="polite"></p>
        <button id="auth-submit" type="submit">Unlock</button>
      </form>
    </main>
    <main id="terminal" aria-label="Shelt terminal" hidden></main>
    <span id="sheltie-peek" aria-hidden="true">
      <svg viewBox="0 0 512 512" focusable="false"><use href="/favicon.svg#sheltie-head" /></svg>
    </span>
    <button id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel" aria-label="设置" data-i18n-aria-label="settings" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
      <span id="update-dot" aria-hidden="true" hidden></span>
    </button>
    <aside id="settings-panel" aria-label="设置" data-i18n-aria-label="settings" hidden>
      <header class="settings-heading">
        <h2 data-i18n="settings">设置</h2>
        <select id="ui-language" class="language-select" aria-label="界面语言" data-i18n-aria-label="language"><option value="zh-CN">中文</option><option value="en">English</option></select>
      </header>
      <section id="settings-herdr" hidden>
        <div class="settings-heading">
          <h2 data-i18n="herdr">Herdr 连接</h2>
          <button id="target-add" class="icon-action" type="button" aria-expanded="false" aria-controls="target-form" aria-label="添加连接" title="添加连接" data-i18n-aria-label="addConnection" data-i18n-title="addConnection">+</button>
        </div>
        <p id="settings-hint" data-i18n="herdrHint">点击连接即可切换，终端会自动重连。</p>
        <ul id="target-list"></ul>
        <form id="target-form" hidden>
          <input id="target-name" type="text" placeholder="名称" data-i18n-placeholder="name" aria-label="名称" data-i18n-aria-label="name" maxlength="40" required />
          <input id="target-remote" type="text" placeholder="SSH 目标（user@host）" data-i18n-placeholder="remote" aria-label="SSH 目标（user@host）" data-i18n-aria-label="remote" required />
          <input id="target-session" type="text" placeholder="会话名（可选）" data-i18n-placeholder="session" aria-label="会话名（可选）" data-i18n-aria-label="session" />
          <div class="settings-form-actions"><button id="target-submit" type="submit">添加</button><button id="target-cancel" type="button" class="ghost" data-i18n="cancel">取消</button></div>
        </form>
      </section>
      <section>
        <label class="settings-switch" for="html-interactive">
          <span data-i18n="interactive">HTML 交互预览</span>
          <input id="html-interactive" type="checkbox" role="switch" aria-describedby="html-interactive-hint" checked />
        </label>
        <p id="html-interactive-hint" class="settings-note" data-i18n="interactiveHint">允许运行 JavaScript、加载外部库和同目录资源。不可信文件可关闭；仅保存在此浏览器，匿名分享始终静态。</p>
      </section>
      <section>
        <button id="password-toggle" class="settings-disclosure" type="button" aria-expanded="false" aria-controls="password-form"><span data-i18n="changePassword">修改密码</span><span class="disclosure-chevron" aria-hidden="true">⌄</span></button>
        <form id="password-form" hidden>
          <input id="current-password" type="password" placeholder="当前密码" data-i18n-placeholder="currentPassword" aria-label="当前密码" data-i18n-aria-label="currentPassword" autocomplete="current-password" required />
          <input id="new-password" type="password" placeholder="新密码（至少 8 个字符）" data-i18n-placeholder="newPassword" aria-label="新密码（至少 8 个字符）" data-i18n-aria-label="newPassword" autocomplete="new-password" minlength="8" maxlength="256" required />
          <input id="confirm-new-password" type="password" placeholder="确认新密码" data-i18n-placeholder="confirmPassword" aria-label="确认新密码" data-i18n-aria-label="confirmPassword" autocomplete="new-password" required />
          <div class="settings-form-actions"><button id="password-submit" type="submit" data-i18n="changePassword">修改密码</button><button id="password-cancel" type="button" class="ghost" data-i18n="cancel">取消</button></div>
        </form>
      </section>
      <p id="settings-status" role="status" aria-live="polite"></p>
      <div class="settings-version-row"><p id="settings-version" aria-label="Shelt 版本" data-i18n-aria-label="version"></p><button id="update-install" type="button" hidden></button></div>
      <p id="update-status" role="status" aria-live="polite"></p>
    </aside>
    <script type="module" src="/client.js"></script>
  </body>
</html>
