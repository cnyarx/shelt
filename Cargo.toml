[package]
name = "shelt"
version = "0.0.1"
edition = "2021"
license = "MIT"

[[bin]]
name = "shelt"
path = "rust/main.rs"

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
bytes = "1.12.1"
futures-util = "0.3.33"
libc = "0.2.189"
portable-pty = "0.9.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
